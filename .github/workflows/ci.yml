name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test Home Assistant integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements_test.txt

      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/openems_zero_injection/manifest.json > /dev/null
          python -m json.tool custom_components/openems_zero_injection/strings.json > /dev/null
          python -m json.tool custom_components/openems_zero_injection/translations/fr.json > /dev/null

      - name: Validate Python syntax
        run: python -m compileall -q custom_components tests

      - name: Run tests
        run: pytest -q
